name: Verge Labs
description: 'Verge Labs (formerly Verge Genomics) is a frontier AI company applying machine
  learning to human biology, building an AI system designed to reason about neurological disease
  at the patient level. Its stated goal is a "virtual biopsy of the brain" — a reconstructed
  picture of what is happening inside a patient''s brain generated from a routine blood draw. The
  company built proprietary genomic datasets from human brain tissue for neurodegenerative diseases
  such as ALS and Parkinson''s, and after an early ALS clinical program refocused on AI methods for
  matching brain therapeutics to the patients most likely to benefit. Verge is a research-stage
  biotech/AI company backed by Threshold Ventures and other venture investors; it does not currently
  publish a public developer API, SDKs, or a developer portal.'
